name: Update GitHub Activity Log

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update README with recent activity
        uses: TheDanniCraft/activity-log@v1
        with:
          GITHUB_USERNAME: "Zxy-2002"
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
